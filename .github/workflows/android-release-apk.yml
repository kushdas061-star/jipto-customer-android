name: Build & Publish Signed JIPTO Android Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name (e.g., 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Assemble & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JIPTO Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Release Keystore Signing (GitHub Secrets or Automated Keytool Generation)
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/jipto-release.keystore"
          if [ -n "$SECRET_KEYSTORE_BASE64" ] && [ -n "$SECRET_KEYSTORE_PASSWORD" ] && [ -n "$SECRET_KEY_ALIAS" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Using configured Android release keystore from GitHub Secrets."
            echo "$SECRET_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 secret not set; generating ephemeral RSA-2048 release keystore via JDK keytool for v1+v2 APK signing."
            GENERATED_PASS=$(openssl rand -hex 16)
            GENERATED_ALIAS="jipto_release_key"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -alias "$GENERATED_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$GENERATED_PASS" \
              -keypass "$GENERATED_PASS" \
              -dname "CN=JIPTO Customer Grocery Delivery, OU=Mobile, O=JIPTO, L=Bengaluru, S=Karnataka, C=IN"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$GENERATED_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$GENERATED_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$GENERATED_PASS" >> "$GITHUB_ENV"
          fi

      - name: Write google-services.json from Secret (if configured)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Wrote android/app/google-services.json from GOOGLE_SERVICES_JSON secret."
          else
            echo "::notice::Using built-in FirebaseOptions initialization for project confident-env-q01dl."
          fi

      - name: Build Signed Release APK (:app:assembleRelease)
        working-directory: ./android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          JIPTO_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate & Verify Signed Release APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*-release.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Signed release APK was not produced. Check Gradle build logs."
            exit 1
          fi
          VERSION_NAME="${{ github.event.inputs.version_name || '1.0.0' }}"
          FINAL_APK="android/app/build/outputs/apk/release/jipto-customer-v${VERSION_NAME}-release.apk"
          cp "$APK_PATH" "$FINAL_APK"
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify --verbose "$FINAL_APK"
          fi
          APK_SIZE_BYTES=$(stat -c%s "$FINAL_APK" 2>/dev/null || wc -c < "$FINAL_APK")
          echo "Verified signed APK: $FINAL_APK ($APK_SIZE_BYTES bytes)"
          echo "VERIFIED_APK_PATH=$FINAL_APK" >> "$GITHUB_ENV"
          echo "VERSION_TAG=v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Upload Signed JIPTO APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jipto-customer-release-apk
          path: ${{ env.VERIFIED_APK_PATH }}
          if-no-files-found: error

      - name: Publish Signed APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "JIPTO Customer Android APK (${{ env.VERSION_TAG }})"
          body: |
            Automated native Android release build for **JIPTO Customer Grocery Delivery** (`com.jipto.customer`).
            - Built with Kotlin, Android SDK 34 & Jetpack Compose
            - Signed & verified with `apksigner` (v1 + v2 signature schemes)
            - Ready for direct download and installation on Android phones via **JIPTO Settings → App Installation / Download APK**
          files: ${{ env.VERIFIED_APK_PATH }}
          draft: false
          prerelease: false

      - name: Clean Up Temporary Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/jipto-release.keystore"
